<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Handelsinseln – Solospiel</title>
<style>
:root {
  --bg:#eef3fb; --card:#ffffff; --ink:#1b2233; --mut:#5d6882; --line:#d9e0ee; --pri:#2f4bd8; --pri-ink:#fff;
  --ok:#12805c; --bad:#c0392b; --warn:#b7791f; --c1:#3f9a52; --c2:#d9822b; --bur:#e0801e; --smo:#d6336c;
  --bub-me:#dbe7ff; --bub-bot:#f1f3f8; --r:14px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg:#0f1420; --card:#182033; --ink:#e8ecf6; --mut:#9aa6c0; --line:#2a3452; --pri:#7088ff; --pri-ink:#0b1020; --ok:#38c796; --bad:#ff7b6b; --warn:#f2b84b; --bub-me:#263a6e; --bub-bot:#222c45; }
}
* { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 var(--font); }
.wrap { max-width:680px; margin:0 auto; padding:10px 14px 40px; }
h1,h2,h3 { margin:0 0 .4em; line-height:1.2; } h1{font-size:1.35rem} h2{font-size:1.15rem} h3{font-size:1rem}
p { margin:.45em 0; }
.card { background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin:12px 0; }
.mut { color:var(--mut); } .small { font-size:.85rem; } .center { text-align:center; }
.row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; } .grow { flex:1; }
button { font:inherit; font-weight:600; border:1px solid var(--line); background:var(--card); color:var(--ink); padding:10px 16px; border-radius:10px; cursor:pointer; min-height:44px; }
button.pri { background:var(--pri); color:var(--pri-ink); border-color:transparent; }
button.ok { background:var(--ok); color:#fff; border-color:transparent; }
button.ghost { background:transparent; }
button:disabled { opacity:.45; cursor:not-allowed; }
button:active:not(:disabled){ transform:translateY(1px); }
button.big { width:100%; font-size:1.05rem; padding:13px 16px; }
input[type=text], select { font:inherit; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; min-height:44px; width:100%; }
label.l { font-size:.85rem; color:var(--mut); display:block; margin:10px 0 3px; }

/* Kopf */
.top { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px; }
.top h1 { margin:0; }
.steps { display:flex; gap:6px; flex-wrap:wrap; margin:4px 0 8px; }
.st { font-size:.78rem; font-weight:700; padding:3px 10px; border-radius:999px; background:var(--line); color:var(--mut); }
.st.on { background:var(--pri); color:var(--pri-ink); } .st.done { background:color-mix(in srgb,var(--ok) 20%,transparent); color:var(--ok); }

/* Szene */
.scene { border-radius:var(--r); overflow:hidden; border:1px solid var(--line); background:#bfe3ff; line-height:0; }
.scene svg { width:100%; height:auto; display:block; }
.pop { font-size:15px; text-anchor:middle; opacity:0; animation:pop 1.3s ease-out forwards; }
@keyframes pop { 0%{opacity:0;transform:translateY(0) scale(.6)} 18%{opacity:1;transform:translateY(-6px) scale(1.1)} 100%{opacity:0;transform:translateY(-38px) scale(1)} }
.arm { transform-box:fill-box; transform-origin:50% 0; }
.working .arm.l { animation:swing .32s infinite alternate ease-in-out; }
.working .arm.r { animation:swing .32s infinite alternate-reverse ease-in-out; }
.working .fb { animation:bob .32s infinite alternate ease-in-out; }
.happy .fb { animation:hop .45s 3 ease-out; }
@keyframes swing { from{transform:rotate(-35deg)} to{transform:rotate(35deg)} }
@keyframes bob { from{transform:translateY(0)} to{transform:translateY(-3px)} }
@keyframes hop { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-9px)} }
.wave { animation:wave 5s linear infinite; } .wave2 { animation:wave 8s linear infinite reverse; }
@keyframes wave { from{transform:translateX(0)} to{transform:translateX(-40px)} }
.cloud { animation:drift 40s linear infinite alternate; } .cloud2 { animation:drift 55s linear infinite alternate-reverse; }
@keyframes drift { from{transform:translateX(-14px)} to{transform:translateX(18px)} }
.cnt { font-size:13px; font-weight:800; fill:#fff; paint-order:stroke; stroke:#0007; stroke-width:3px; text-anchor:middle; }
.land { font-size:11px; font-weight:800; fill:#fff; text-anchor:middle; letter-spacing:.3px; }
#ship { transition:none; } .ship-cargo { font-size:11px; font-weight:800; fill:#1b2233; text-anchor:middle; line-height:1; }

/* Karten & Chips */
.chip { display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:999px; font-weight:700; font-size:.92rem; background:var(--line); }
.chip.b { background:color-mix(in srgb,var(--bur) 22%,transparent); color:var(--bur); }
.chip.s { background:color-mix(in srgb,var(--smo) 20%,transparent); color:var(--smo); }
.rate { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.note { border-left:4px solid var(--pri); background:color-mix(in srgb,var(--pri) 8%,transparent); padding:8px 12px; border-radius:0 10px 10px 0; margin:10px 0; }
.note.ok { border-color:var(--ok); background:color-mix(in srgb,var(--ok) 10%,transparent); }
.note.warn { border-color:var(--warn); background:color-mix(in srgb,var(--warn) 12%,transparent); }
.note.bad { border-color:var(--bad); background:color-mix(in srgb,var(--bad) 10%,transparent); }

/* Stundenkacheln */
.tiles { display:grid; grid-template-columns:repeat(10,1fr); gap:5px; margin:10px 0; }
.tile { min-height:46px; padding:0; font-size:1.25rem; border-radius:9px; border:2px solid transparent; background:color-mix(in srgb,var(--smo) 16%,var(--card)); }
.tile.b { background:color-mix(in srgb,var(--bur) 26%,var(--card)); }
.tile span { display:block; font-size:.62rem; color:var(--mut); line-height:1; margin-top:1px; font-weight:700; }
.split { display:grid; grid-template-columns:1fr 1fr; gap:10px; } .split>* { min-width:0; }
.box { border:1px solid var(--line); border-radius:12px; padding:10px; text-align:center; }
.box b.n { display:block; font-size:1.6rem; line-height:1.1; }
.stepper { display:flex; align-items:center; gap:6px; justify-content:center; }
.stepper button { width:42px; min-width:42px; padding:0; font-size:1.3rem; }
.stepper output { min-width:38px; text-align:center; font-size:1.4rem; font-weight:800; }

/* Tablett */
.tray { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; min-height:36px; }
.menu { display:inline-flex; background:color-mix(in srgb,var(--ok) 14%,var(--card)); border:1px solid color-mix(in srgb,var(--ok) 40%,transparent); border-radius:10px; padding:2px 6px; font-size:1.15rem; animation:in .35s both; }
.left { display:inline-flex; background:var(--card); border:1px dashed var(--mut); border-radius:10px; padding:2px 6px; font-size:1.05rem; opacity:.55; animation:in .35s both; }
@keyframes in { from{transform:scale(.4);opacity:0} to{transform:scale(1);opacity:1} }
.big-num { font-size:2.4rem; font-weight:900; line-height:1; }

/* Chat */
.chat { max-height:260px; overflow:auto; display:flex; flex-direction:column; gap:7px; padding:4px 2px; }
.msg { max-width:88%; padding:8px 12px; border-radius:14px; font-size:.95rem; animation:in .25s both; }
.msg.me { align-self:flex-end; background:var(--bub-me); border-bottom-right-radius:4px; }
.msg.bot { align-self:flex-start; background:var(--bub-bot); border-bottom-left-radius:4px; }
.msg.sys { align-self:center; background:transparent; color:var(--mut); font-size:.82rem; padding:2px; }
.msg small { display:block; color:var(--mut); font-weight:700; font-size:.72rem; margin-bottom:1px; }
.btns { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; } .btns>button { flex:1 1 140px; }
.seg { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:6px 0; }
.seg button.sel { border-color:var(--pri); box-shadow:inset 0 0 0 2px var(--pri); }

/* Balken */
.bars { display:grid; gap:10px; margin:10px 0; }
.bar-row .lab { display:flex; justify-content:space-between; font-size:.88rem; font-weight:700; margin-bottom:3px; }
.bar { height:20px; background:var(--line); border-radius:7px; overflow:hidden; margin-bottom:4px; }
.bar i { display:block; height:100%; width:0; border-radius:7px; transition:width 1.1s cubic-bezier(.2,.8,.2,1); font-style:normal; color:#fff; font-size:.75rem; font-weight:800; padding:2px 8px; white-space:nowrap; }
.bar i.a { background:#8793ad; } .bar i.t { background:var(--ok); }
table { border-collapse:collapse; width:100%; font-size:.9rem; }
th,td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); } th { color:var(--mut); font-size:.78rem; }
.q button { display:block; width:100%; text-align:left; margin:6px 0; font-weight:500; }
.q button.right { background:color-mix(in srgb,var(--ok) 20%,transparent); border-color:var(--ok); }
.q button.wrong { background:color-mix(in srgb,var(--bad) 16%,transparent); border-color:var(--bad); }
.pill { display:inline-block; padding:1px 8px; border-radius:999px; font-size:.78rem; font-weight:800; color:#fff; }
.cards { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.cc { border:2px solid var(--line); border-radius:14px; padding:10px; text-align:center; cursor:pointer; background:var(--card); font:inherit; color:var(--ink); font-weight:600; }
.cc.sel { border-color:var(--pri); box-shadow:0 0 0 2px color-mix(in srgb,var(--pri) 30%,transparent); }
.portrait { float:right; width:34%; max-width:170px; margin:2px 0 8px 14px; } .portrait img { width:100%; height:auto; border-radius:10px; display:block; border:1px solid var(--line); } .portrait figcaption { font-size:.72rem; color:var(--mut); text-align:center; margin-top:3px; }
@media (max-width:420px){ .portrait{ width:40%; } }
.tl { border-left:3px solid var(--pri); margin:8px 0 12px 8px; padding-left: 14px; display:grid; gap:10px; }
.tl div { position:relative; } .tl div::before { content:''; position:absolute; left:-21px; top:6px; width:10px; height:10px; border-radius:50%; background:var(--pri); }
.tl > div > b { display:block; font-size:.85rem; color:var(--pri); } .tl span { font-size:.92rem; }
.ric-k { border:1px solid var(--line); border-radius:12px; padding:9px 12px; margin:8px 0; } .ric-k b { display:block; margin-bottom:2px; }
.ric-k span { font-size:.93rem; color:var(--ink); }
@media (max-width:420px){ .tile{min-height:42px;font-size:1.05rem} }
@media (prefers-reduced-motion: reduce){ *{animation-duration:.01s!important;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>🏝️ Handelsinseln</h1><button class="ghost small" id="btnReset" style="min-height:34px;padding:4px 12px">Neu starten</button></div>
  <div class="steps" id="steps"></div>

  <div class="scene" id="sceneBox">
    <svg id="scene" viewBox="0 0 400 200" role="img" aria-label="Zwei Inseln mit Burgerbude und Smoothie-Bar, dazwischen ein Schiff">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd0ff"/><stop offset="1" stop-color="#d9f0ff"/></linearGradient>
        <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b9bd6"/><stop offset="1" stop-color="#1e6fa8"/></linearGradient>
      </defs>
      <rect width="400" height="200" fill="url(#sky)"/>
      <circle cx="205" cy="34" r="16" fill="#ffe27a"/>
      <g class="cloud" fill="#fff" opacity=".9"><ellipse cx="90" cy="46" rx="22" ry="7"/><ellipse cx="106" cy="42" rx="14" ry="7"/></g>
      <g class="cloud2" fill="#fff" opacity=".85"><ellipse cx="320" cy="56" rx="20" ry="6"/><ellipse cx="335" cy="52" rx="12" ry="6"/></g>
      <rect y="112" width="400" height="88" fill="url(#sea)"/>
      <g opacity=".35" stroke="#fff" fill="none" stroke-width="1.6">
        <g class="wave"><path id="wv" d="M-40 168 q10 -6 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0"/></g>
        <g class="wave2"><path d="M-40 184 q10 -6 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0"/></g>
        <g class="wave"><path d="M140 132 q10 -6 20 0 t20 0 t20 0 t20 0 t20 0 t20 0"/></g>
      </g>
      <g id="lands"></g>
      <g id="shipG"><g id="ship" style="transform:translate(168px,152px);opacity:0"><text class="ship-cargo" id="cargo" y="-24"></text><text id="boat" font-size="26" text-anchor="middle" y="0">⛵</text></g></g>
      <g id="fx"></g>
    </svg>
  </div>

  <div id="main"></div>
  <p class="small mut center" style="margin-top:24px">Spiel zum Thema „Handel nach David Ricardo". Alles läuft lokal in diesem Browserfenster.</p>
</div>

<script>
'use strict';
/* ===================== Modell ===================== */
const H = 10;                                   // Arbeitsstunden pro Runde
const GD = { B: { e: '🍔', n: 'Doppelburger', pl: 'Doppelburger' }, S: { e: '🥤', n: 'Smoothie', pl: 'Smoothies' } };
const LAND = ['Grünland', 'Backland'];
const BOT = ['Frida', 'Bela'];
const STAGES = [
  { id: 1, title: 'Stufe 1 · Jeder kann etwas besser', sub: 'Absoluter Vorteil',
    rates: { 1: { B: 4, S: 1 }, 2: { B: 1, S: 4 } },
    story: 'Zwei Länder, zwei Spezialitäten: Grünland hat Rinderweiden und die besten Grillmeister, Backland hat Obstgärten und eine Saftpresse. Die Gäste wollen jeweils ein Menü aus <b>1 Doppelburger + 1 Smoothie</b>. Nur vollständige Menüs bringen Punkte.',
    q: { t: 'Warum lohnt sich der Handel in Stufe 1 für beide Länder?', o: [
      'Weil Grünland alles besser kann und deshalb alles liefern sollte.',
      'Weil jedes Land das Gut herstellt, bei dem es pro Stunde mehr schafft (absoluter Vorteil), und man danach tauscht – so entstehen insgesamt mehr Menüs.',
      'Weil man mit Handel weniger arbeiten muss.'], c: 1 } },
  { id: 2, title: 'Stufe 2 · Ein Land kann alles besser', sub: 'Komparativer Vorteil',
    rates: { 1: { B: 5, S: 5 }, 2: { B: 1, S: 4 } },
    story: 'Grünland hat neue Maschinen und ist jetzt bei <b>beiden</b> Gütern besser als Backland. Lohnt sich Handel dann überhaupt noch – und für wen? Wieder zählen nur komplette Menüs (1 Doppelburger + 1 Smoothie).',
    q: { t: 'Grünland ist bei beiden Gütern besser. Warum lohnt sich der Handel trotzdem?', o: [
      'Tut er nicht – Grünland sollte alles selbst herstellen.',
      'Weil Backland mehr Arbeitsstunden zur Verfügung hat.',
      'Weil jedes Land sich auf das Gut konzentriert, bei dem es die geringsten Opportunitätskosten hat (komparativer Vorteil) – dann entstehen zusammen mehr Menüs.'], c: 2 } }
];
const DIFF = { leicht: { t: 0.1, auto: true, label: 'freundlich' }, normal: { t: 0.3, auto: false, label: 'normal' }, hart: { t: 0.45, auto: false, label: 'hart' } };
const MAXTRIES = 6;
const MAXRUNS = 3;                              // Handelsrunden je Stufe
const SHARE = 0.4;                              // Mindestanteil am Handelsgewinn für „bestes Ergebnis“

const mn = (h) => Math.min(h.B, h.S);
const other = (g) => (g === 'B' ? 'S' : 'B');
const fnum = (x) => String(Math.round(x * 100) / 100).replace('.', ',');
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function bestAuto(r) { let best = { m: -1, hB: 0 }; for (let h = 0; h <= H; h++) { const m = Math.min(r.B * h, r.S * (H - h)); if (m > best.m) best = { m, hB: h }; } return best; }
function jointBest(r1, r2) {
  let best = { m: -1, h1: 0, h2: 0 };
  for (let h2 = 0; h2 <= H; h2++) for (let h1 = 0; h1 <= H; h1++) {
    const m = Math.min(r1.B * h1 + r2.B * h2, r1.S * (H - h1) + r2.S * (H - h2));
    if (m > best.m) best = { m, h1, h2 };
  }
  return best;
}
function prodOf(r, hB) { return { B: r.B * hB, S: r.S * (H - hB) }; }
function stageInfo(si) {
  const s = STAGES[si], r1 = s.rates[1], r2 = s.rates[2];
  const a1 = bestAuto(r1), a2 = bestAuto(r2), j = jointBest(r1, r2);
  return { s, r: s.rates, auto: { 1: a1, 2: a2 }, joint: j, gain: j.m - a1.m - a2.m };
}

/* ----- Computerpartner ----- */
function botPlanHours(si, land) { const j = stageInfo(si).joint; return land === 1 ? j.h1 : j.h2; }
function dealApply(P, Q, o) {                       // o aus Sicht des Spielers: gibt n von give, bekommt m vom anderen Gut
  const g = o.give, t = other(g);
  return { P: { [g]: P[g] - o.n, [t]: P[t] + o.m }, Q: { [g]: Q[g] + o.n, [t]: Q[t] - o.m } };
}
function dealOk(P, Q, o) { return o.n > 0 && o.m > 0 && o.n <= P[o.give] && o.m <= Q[other(o.give)]; }
function dealEval(si, pl, P, Q, o) {
  const inf = stageInfo(si), bl = 3 - pl, res = dealApply(P, Q, o);
  const gp = mn(res.P) - inf.auto[pl].m, gb = mn(res.Q) - inf.auto[bl].m;
  return { res, gp, gb, impB: mn(res.Q) - mn(Q), impP: mn(res.P) - mn(P), G: inf.gain };
}
function botThr(si, diff) { return Math.max(1, Math.ceil(DIFF[diff].t * stageInfo(si).gain)); }
function botCounter(si, pl, P, Q, diff) {
  const inf = stageInfo(si); let best = null; const thr = botThr(si, diff), minP = Math.max(1, Math.ceil(0.2 * inf.gain));
  for (const give of ['B', 'S']) for (let n = 1; n <= P[give]; n++) for (let m = 1; m <= Q[other(give)]; m++) {
    const o = { give, n, m }, e = dealEval(si, pl, P, Q, o);
    if (e.impB <= 0 || e.impP <= 0 || e.gb < thr) continue;
    let score;
    if (diff === 'hart') { if (e.gp < minP) continue; score = e.gb * 1000 - e.gp; }
    else if (diff === 'leicht') score = Math.min(e.gp, e.gb) * 1000 + e.gp;
    else score = Math.min(e.gp, e.gb) * 1000 + e.gb;
    if (!best || score > best.score) best = { o, score, e };
  }
  return best;
}
function botAnswer(si, pl, P, Q, o, diff) {
  if (!(o.n > 0 && o.m > 0)) return { ok: false, text: 'Ein Tausch braucht zwei Seiten – du musst etwas geben <i>und</i> etwas bekommen.' };
  if (o.n > P[o.give]) return { ok: false, text: 'So viel hast du gar nicht zum Hergeben.' };
  if (o.m > Q[other(o.give)]) return { ok: false, text: 'So viele ' + GD[other(o.give)].pl + ' habe ich gar nicht.' };
  const e = dealEval(si, pl, P, Q, o);
  if (e.impB <= 0) return { ok: false, text: 'Dann hätte ich danach nicht mehr Menüs als jetzt. Warum sollte ich das tun?' };
  if (e.gb < botThr(si, diff)) return { ok: false, text: 'Da bleibt für mich zu wenig übrig. Ich möchte schon deutlich mehr Menüs haben, als ich allein geschafft hätte.', thin: true };
  const note = e.gp < 0 ? ' (Ob du dabei gut wegkommst, ist deine Sache …)' : '';
  return { ok: true, text: 'Abgemacht! 🤝' + note, e };
}

/* ===================== Zustand ===================== */
let st;
function freshState() {
  return { step: 'start', si: 0, startStage: 0, land: 1, diff: 'normal', name: '', round: 'A', hB: 5, stock: null, hidden: true, log: [], tries: MAXTRIES,
    pending: null, rp: 0, tr: 1, att: [[], []], cur: null, give: 'B', n: 5, m: 5, res: [{}, {}], quiz: {}, busy: false, shownRates: false };
}
st = freshState();
const $ = (s) => document.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
const pl = () => st.land, bl = () => 3 - st.land;
const own = () => stageInfo(st.si).r[pl()];
const oth = () => stageInfo(st.si).r[bl()];

/* ===================== Szene ===================== */
const X0 = { 1: 0, 2: 260 };
function figure(id, x, shirt, hair) {
  return `<g id="${id}" transform="translate(${x},118)"><g class="fb">
    <rect x="-7" y="-14" width="5" height="14" rx="2" fill="#37415a"/><rect x="2" y="-14" width="5" height="14" rx="2" fill="#37415a"/>
    <rect x="-9" y="-34" width="18" height="22" rx="6" fill="${shirt}"/>
    <g class="arm l"><rect x="-14" y="-33" width="5" height="16" rx="2.5" fill="${shirt}"/><circle cx="-11.5" cy="-16.5" r="2.6" fill="#f2c9a0"/></g>
    <g class="arm r"><rect x="9" y="-33" width="5" height="16" rx="2.5" fill="${shirt}"/><circle cx="11.5" cy="-16.5" r="2.6" fill="#f2c9a0"/></g>
    <circle cx="0" cy="-42" r="9" fill="#f2c9a0"/><path d="M-9.5 -43 a9.5 9.5 0 0 1 19 0 q-9.5 -4 -19 0z" fill="${hair}"/>
    <circle cx="-3.2" cy="-41" r="1.2" fill="#222"/><circle cx="3.2" cy="-41" r="1.2" fill="#222"/><path d="M-3 -37.5 q3 3 6 0" stroke="#222" fill="none" stroke-width="1.1" stroke-linecap="round"/>
  </g></g>`;
}
function stand(x, emoji, col1, col2) {
  return `<rect x="${x + 2}" y="96" width="36" height="22" fill="#a9743f"/><rect x="${x + 6}" y="104" width="28" height="6" fill="#6b4524" opacity=".5"/>
    <g><rect x="${x}" y="88" width="10" height="10" fill="${col1}"/><rect x="${x + 10}" y="88" width="10" height="10" fill="${col2}"/><rect x="${x + 20}" y="88" width="10" height="10" fill="${col1}"/><rect x="${x + 30}" y="88" width="10" height="10" fill="${col2}"/></g>
    <rect x="${x - 1}" y="86" width="42" height="3" rx="1.5" fill="#6b4524"/><text x="${x + 20}" y="112" font-size="15" text-anchor="middle">${emoji}</text>`;
}
function buildScene() {
  let h = '';
  for (const c of [1, 2]) {
    const x = X0[c], g1 = c === 1 ? '#5aa85f' : '#e6b26a', g2 = c === 1 ? '#3e8445' : '#c98d3c';
    h += `<path d="M${x} 116 h140 v26 q0 20 -20 20 h-100 q-20 0 -20 -20 z" fill="${g2}"/><path d="M${x} 116 h140 v8 h-140z" fill="${g1}"/>`;
    h += `<rect x="${c === 1 ? 140 : 244}" y="132" width="16" height="5" fill="#8a5a2b"/>`;
    h += stand(x + 10, GD.B.e, '#e0541e', '#fff6e6') + stand(x + 90, GD.S.e, '#d6336c', '#fff0f5');
    h += figure('fig' + c, x + 70, c === 1 ? '#2f6fdb' : '#e0541e', c === 1 ? '#5b3a1e' : '#222');
    h += `<rect x="${x + 28}" y="9" width="84" height="19" rx="9" fill="${c === 1 ? '#2e7d3a' : '#b8691e'}"/><text class="land" x="${x + 70}" y="22.5" id="ln${c}">${LAND[c - 1]}</text>`;
    h += `<text class="cnt" id="cB${c}" x="${x + 30}" y="141">🍔 –</text><text class="cnt" id="cS${c}" x="${x + 110}" y="141">🥤 –</text>`;
    h += `<text class="land" id="who${c}" x="${x + 70}" y="157" font-size="9" opacity=".9"></text>`;
  }
  $('#lands').innerHTML = h;
}
function sceneWho() {
  $('#who' + pl()).textContent = 'DU' + (st.name ? ' · ' + st.name : '');
  $('#who' + bl()).textContent = BOT[bl() - 1] + ' (Computer)';
}
function setCount(c, g, v, hidden) { const el = $('#c' + g + c); if (el) el.textContent = GD[g].e + ' ' + (hidden ? '?' : v); }
const cuTok = {};
function showStock() {
  for (const c of [1, 2]) for (const g of ['B', 'S']) cuTok[c + g] = -1;
  for (const c of [1, 2]) for (const g of ['B', 'S']) setCount(c, g, st.stock ? st.stock[c][g] : '–', c === bl() && st.hidden || !st.stock);
}
function pop(x, y, txt, delay) {
  const t = document.createElementNS(NS, 'text'); t.setAttribute('x', x); t.setAttribute('y', y); t.setAttribute('class', 'pop'); t.style.animationDelay = delay + 'ms'; t.textContent = txt; $('#fx').appendChild(t);
  setTimeout(() => t.remove(), delay + 1600);
}
function countUp(c, g, to, ms, hidden) {
  if (hidden) { setCount(c, g, 0, true); return; }
  const tok = (cuTok[c + g] = (cuTok[c + g] || 0) + 1 + Math.random()), t0 = performance.now();
  const step = (t) => { if (cuTok[c + g] !== tok) return; const k = Math.min(1, (t - t0) / ms); setCount(c, g, Math.round(to * k)); if (k < 1) requestAnimationFrame(step); }; requestAnimationFrame(step);
}
async function produceAnim(c, p, hidden) {
  const fg = $('#fig' + c); fg.classList.add('working');
  const nb = hidden ? Math.min(3, p.B > 0 ? 3 : 0) : Math.min(p.B, 10), ns = hidden ? Math.min(3, p.S > 0 ? 3 : 0) : Math.min(p.S, 10);
  for (let i = 0; i < nb; i++) pop(X0[c] + 30 + (Math.random() * 12 - 6), 84, GD.B.e, i * 140);
  for (let i = 0; i < ns; i++) pop(X0[c] + 110 + (Math.random() * 12 - 6), 84, GD.S.e, i * 140);
  const dur = Math.max(nb, ns) * 140 + 700;
  countUp(c, 'B', p.B, dur, hidden); countUp(c, 'S', p.S, dur, hidden);
  await sleep(dur + 300); fg.classList.remove('working');
}
async function shipTrip(from, to, cargo) {
  const ship = $('#ship'), x0 = from === 1 ? 168 : 232, x1 = to === 1 ? 168 : 232;
  $('#cargo').textContent = cargo; ship.style.transition = 'none'; ship.style.opacity = 1; ship.style.transform = `translate(${x0}px,152px)`;
  await sleep(40); ship.style.transition = 'transform 1.5s ease-in-out'; ship.style.transform = `translate(${x1}px,152px)`; await sleep(1600);
}
async function tradeAnim(o) {
  const g = o.give, t = other(g), from = pl(), to = bl();
  await shipTrip(from, to, o.n + '× ' + GD[g].e);
  $('#fig' + to).classList.add('happy');
  await shipTrip(to, from, o.m + '× ' + GD[t].e);
  $('#fig' + from).classList.add('happy'); pop(200, 120, '🤝', 0);
  setTimeout(() => { $('#ship').style.opacity = 0; $('#fig1').classList.remove('happy'); $('#fig2').classList.remove('happy'); }, 1300);
}

/* ===================== Hilfsdarstellungen ===================== */
const gch = (g, n) => `<span class="chip ${g.toLowerCase()}">${GD[g].e} ${n != null ? n : GD[g].n}</span>`;
function rateRow(r) { return `<div class="rate"><span class="mut small">Pro Stunde schaffst du:</span>${gch('B', r.B + ' × Doppelburger')}<span class="mut">oder</span>${gch('S', r.S + ' × Smoothie')}</div>`; }
function trayHtml(B, S) {
  const m = Math.min(B, S), cap = 14; let h = '<div class="tray">';
  for (let i = 0; i < Math.min(m, cap); i++) h += `<span class="menu" style="animation-delay:${i * 60}ms">🍔🥤</span>`;
  if (m > cap) h += `<span class="menu">+${m - cap}</span>`;
  const lg = B > S ? 'B' : 'S', lo = Math.abs(B - S);
  for (let i = 0; i < Math.min(lo, 8); i++) h += `<span class="left" style="animation-delay:${(m + i) * 60}ms">${GD[lg].e}</span>`;
  if (lo > 8) h += `<span class="left">+${lo - 8}</span>`;
  return h + '</div>';
}
function stepsHtml() {
  if (st.step === 'start') return '';
  const lab = ['Alleine', 'Handel', 'Auflösung'], cur = { plan: st.round === 'A' ? 0 : 1, prod: st.round === 'A' ? 0 : 1, result: st.round === 'A' ? 0 : 1, trade: 1, resolve: 2, brief: -1, ric: 3, end: 3 }[st.step];
  return `<span class="st on">Stufe ${STAGES[st.si].id}</span>` + lab.map((l, i) => `<span class="st ${cur === i ? 'on' : cur > i ? 'done' : ''}">${i + 1} · ${l}</span>`).join('');
}
function logHtml() {
  return `<div class="chat" id="chat">${st.log.map((m) => `<div class="msg ${m.w}">${m.w === 'sys' ? '' : '<small>' + (m.w === 'me' ? 'Du' : BOT[bl() - 1]) + '</small>'}${m.t}</div>`).join('')}</div>`;
}
function say(w, t) { st.log.push({ w, t }); }
function offerTxt(o) { return `<b>${o.n} × ${GD[o.give].e}</b> ${o.give === 'B' ? 'Doppelburger' : 'Smoothies'} gegen <b>${o.m} × ${GD[other(o.give)].e}</b> ${other(o.give) === 'B' ? 'Doppelburger' : 'Smoothies'}`; }

/* ===================== Ablauf ===================== */
function go(step) { st.step = step; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
function startStage(si) {
  st.si = si; st.tr = 1; st.att[si] = []; st.cur = null; st.round = 'A'; st.log = []; st.stock = null; st.hidden = true; st.pending = null; st.tries = MAXTRIES; st.shownRates = false;
  const r = own(); st.hB = Math.round(H / 2); buildScene(); sceneWho(); showStock(); go('brief');
}
async function doProduce() {
  if (st.busy) return; st.busy = true; render();
  const si = st.si, inf = stageInfo(si), p = prodOf(own(), st.hB), bh = st.round === 'A' ? bestAuto(inf.r[bl()]).hB : botPlanHours(si, bl()), q = prodOf(inf.r[bl()], bh);
  st.stock = { [pl()]: p, [bl()]: q }; st.hidden = true;
  setCount(1, 'B', 0); setCount(1, 'S', 0); setCount(2, 'B', 0); setCount(2, 'S', 0);
  await Promise.all([produceAnim(pl(), p, false), produceAnim(bl(), q, true)]);
  st.busy = false;
  if (st.round === 'A') go('result'); else { say('sys', 'Die Produktion ist fertig. Jetzt wird verhandelt.'); st.give = p.B >= p.S ? 'B' : 'S'; st.n = Math.round(p[st.give] / 2); st.m = st.n; go('trade'); }
}
function judge(si, p, o) {
  const inf = stageInfo(si), total = mn(p) + mn(o), gp = mn(p) - inf.auto[pl()].m, need = Math.max(1, Math.ceil(SHARE * inf.gain));
  return { total, gp, need, maxTotal: inf.joint.m, okTotal: total >= inf.joint.m, okShare: gp >= need, success: total >= inf.joint.m && gp >= need };
}
function finishTrade() {
  const e = { p: { ...st.stock[pl()] }, o: { ...st.stock[bl()] } }; e.j = judge(st.si, e.p, e.o); e.run = st.tr;
  st.cur = e; st.att[st.si].push(e);
  const rank = (x) => [x.j.success ? 1 : 0, x.j.total, mn(x.p)];
  const best = st.att[st.si].reduce((b, x) => { const a = rank(x), c = rank(b); for (let i = 0; i < 3; i++) { if (a[i] !== c[i]) return a[i] > c[i] ? x : b; } return b; });
  st.res[st.si].B = best; go('result');
}
function retryTrade() {
  st.tr++; st.round = 'B'; st.stock = null; st.hidden = true; st.pending = null; st.tries = MAXTRIES; st.cur = null;
  say('sys', '— Neuer Versuch ' + st.tr + ' von ' + MAXRUNS + ' —'); showStock(); go('plan');
}
function finishRoundA() { st.res[st.si].A = { p: { ...st.stock[pl()] }, o: { ...st.stock[bl()] } }; st.round = 'B'; st.stock = null; st.hidden = true; st.log = []; st.pending = null; st.tries = MAXTRIES; st.shownRates = false; st.hB = Math.round(H / 2); st.tr = 1; showStock(); go('plan'); }

/* ===================== Render ===================== */
const main = $('#main');
function render() {
  $('#steps').innerHTML = stepsHtml(); showStock();
  const f = { start: rStart, brief: rBrief, plan: rPlan, prod: rProd, result: rResult, trade: rTrade, resolve: rResolve, ric: rRic, end: rEnd }[st.step];
  $('#sceneBox').style.display = st.step === 'ric' ? 'none' : '';
  main.innerHTML = f();
  if (st.step === 'resolve') animateBars();
  const ch = $('#chat'); if (ch) ch.scrollTop = ch.scrollHeight;
}

function rStart() {
  return `<div class="card"><h2>Willkommen auf den Handelsinseln!</h2>
    <p>Du führst ein kleines Land, das Doppelburger 🍔 und Smoothies 🥤 herstellt. Gäste bestellen immer ein <b>Menü: 1 Doppelburger + 1 Smoothie</b>. Du hast pro Runde <b>${H} Arbeitsstunden</b>.</p>
    <p>Zuerst arbeitest du allein, danach darfst du mit dem Nachbarland (Computer) handeln. Findest du heraus, wie ihr zusammen am meisten erreicht?</p>
    <label class="l">Dein Name (optional)</label><input type="text" id="inName" maxlength="24" value="${st.name.replace(/"/g, '')}" placeholder="z. B. Mia">
    <label class="l">Dein Land</label>
    <div class="cards"><button class="cc ${st.land === 1 ? 'sel' : ''}" data-land="1">🌳<br>Grünland</button><button class="cc ${st.land === 2 ? 'sel' : ''}" data-land="2">🏜️<br>Backland</button></div>
    <label class="l">Verhandlungsstil des Computers</label>
    <select id="inDiff">${Object.keys(DIFF).map((k) => `<option value="${k}" ${st.diff === k ? 'selected' : ''}>${DIFF[k].label}${k === 'leicht' ? ' (macht Gegenvorschläge)' : k === 'hart' ? ' (feilscht)' : ''}</option>`).join('')}</select>
    <div class="btns" style="margin-top:14px"><button class="pri" data-start="0">Start mit Stufe 1</button><button data-start="1">Direkt zu Stufe 2</button></div>
  </div>`;
}
function rBrief() {
  const s = STAGES[st.si], r = own();
  return `<div class="card"><h2>${s.title}</h2><p class="mut small">${s.sub}</p><p>${s.story}</p>
    <div class="note"><b>Dein Land: ${LAND[pl() - 1]}.</b><br>${rateRow(r)}</div>
    <p class="small mut">Das Nachbarland (${LAND[bl() - 1]}, ${BOT[bl() - 1]}) hat <i>andere</i> Bedingungen. Welche, erfährst du erst im Gespräch.</p>
    <button class="pri big" data-act="toPlan">Los geht's: Runde A (allein arbeiten)</button></div>`;

  const r = own(), hB = st.hB, p = prodOf(r, hB);

    ${rateRow(r)}

    <p class="small mut center">Das wirst du herstellen. Wie viele Menüs ergibt das?</p>
    ${A ? '' : `<div style="margin-top:10px">${logHtml()}</div><div class="btns"><button data-act="askRates" ${st.shownRates ? 'disabled' : ''}>💬 ${BOT[bl() - 1]} fragen: Was schaffst du pro Stunde?</button></div>`}
    <button class="pri big" style="margin-top:12px" data-act="produce">Produktion starten 🔨</button></div>`;
}
function rProd() { return `<div class="card center"><h2>Die Arbeit läuft …</h2><p class="mut">Beide Länder produzieren.</p></div>`; }
function rResult() {
  const rs = st.round === 'A' ? (st.res[st.si].A || { p: st.stock[pl()] }) : st.cur, p = rs.p, m = mn(p), A = st.round === 'A', inf = stageInfo(st.si);
  let h = `<div class="card"><h2>${A ? 'Ergebnis Runde A' : 'Ergebnis Handelsrunde ' + st.tr + ' von ' + MAXRUNS}</h2>
    <div class="row"><div><div class="big-num">${m}</div><div class="mut small">Menüs</div></div><div class="grow small mut">Du hast ${gch('B', p.B)} und ${gch('S', p.S)}.</div></div>${trayHtml(p.B, p.S)}`;
  if (p.B !== p.S) { const g = p.B > p.S ? 'B' : 'S', n = Math.abs(p.B - p.S); h += `<div class="note warn">Übrig: <b>${n} × ${GD[g].e}</b>. Ohne passenden Partner (${GD[other(g)].e}) sind sie wertlos – ein Menü braucht beides.</div>`; }
  if (A) {
    const b = inf.auto[pl()];
    h += m === b.m ? `<div class="note ok">Genau richtig: ${b.m} Menüs ist das Maximum, das du <b>allein</b> schaffen kannst.</div>`
      : `<div class="note">Allein wären maximal <b>${b.m} Menüs</b> möglich gewesen (mit ${b.hB} Std. 🍔 und ${H - b.hB} Std. 🥤). Du kannst es in der nächsten Stufe nochmal besser machen.</div>`;
    h += `<button class="pri big" data-act="roundB">Weiter: Runde B mit Handel</button>`;
  } else {
    const a = st.res[st.si].A.p, d = m - mn(a), j = rs.j, last = st.tr >= MAXRUNS;
    h += `<div class="note ${d > 0 ? 'ok' : 'warn'}">${d > 0 ? `Mit Handel schaffst du <b>${d} Menüs mehr</b> als allein (Runde A: ${mn(a)}).` : d === 0 ? `Genauso viel wie allein (Runde A: ${mn(a)}). Ging da noch mehr?` : `Weniger als allein (Runde A: ${mn(a)}).`}</div>`;
    h += `<p class="small mut">Das Nachbarland hat ${mn(rs.o)} Menüs, zusammen habt ihr <b>${j.total}</b>.</p>`;
    if (j.success) h += `<div class="note ok"><b>Bestes Ergebnis erreicht! 🏆</b> Ihr habt zusammen das Maximum herausgeholt (${j.maxTotal} Menüs), und du hast einen guten Anteil des Handelsgewinns bekommen.</div><button class="pri big" data-act="toResolve">Auflösung ansehen</button>`;
    else {
      const why = [];
      if (!j.okTotal) why.push('Zusammen habt ihr noch <b>nicht das Maximum</b> erreicht. Überlegt, wer sich worauf konzentrieren sollte und wie ihr tauscht, damit nichts übrig bleibt.');
      if (!j.okShare) why.push(j.okTotal ? 'Zusammen habt ihr das Maximum erreicht, aber <b>dein Anteil am Gewinn ist klein</b>. Wie viel Gewinn bringt der Handel dir im Vergleich zu deinem Partner? Verhandle besser.' : 'Außerdem ist dein Anteil am Handelsgewinn noch klein.');
      h += `<div class="note warn"><b>Noch nicht das Beste.</b><br>${why.join('<br>')}</div>`;
      h += last ? `<p class="small mut">Das war die letzte Handelsrunde.</p><button class="pri big" data-act="toResolve">Auflösung ansehen</button>`
        : `<button class="pri big" data-act="retry">Noch einmal versuchen (Handelsrunde ${st.tr + 1} von ${MAXRUNS})</button>`;

}
function rTrade() {
  const s = st.stock, P = s[pl()], inf = stageInfo(st.si), curM = mn(P);
  const max = P[st.give], n = Math.min(st.n, max);
  const e = dealOk(P, { B: 999, S: 999 }, { give: st.give, n, m: st.m }) ? (() => { const r = dealApply(P, { B: 999, S: 999 }, { give: st.give, n, m: st.m }); return r.P; })() : null;
  const left = st.tries;
  return `<div class="card"><h2>Verhandlung</h2>
    <p class="small mut">Du hast jetzt ${gch('B', P.B)} und ${gch('S', P.S)} → <b>${curM} Menüs</b>. ${BOT[bl() - 1]}s Lager bleibt geheim. Noch <b>${left}</b> Verhandlungsschritt${left === 1 ? '' : 'e'}.</p>
    ${logHtml()}
    ${st.pending ? `<div class="note"><b>Gegenvorschlag:</b> ${offerTxt(st.pending)}<div class="btns"><button class="ok" data-act="acceptPending">Annehmen</button><button data-act="dropPending">Ablehnen</button></div></div>` : ''}
    <div class="seg"><button data-give="B" class="${st.give === 'B' ? 'sel' : ''}">Ich gebe 🍔</button><button data-give="S" class="${st.give === 'S' ? 'sel' : ''}">Ich gebe 🥤</button></div>
    <div class="split">
      <div class="box"><div class="small mut">Ich gebe (${GD[st.give].e})</div><div class="stepper"><button data-act="nm">−</button><output>${n}</output><button data-act="np">+</button></div></div>
      <div class="box"><div class="small mut">Ich bekomme (${GD[other(st.give)].e})</div><div class="stepper"><button data-act="mm">−</button><output>${st.m}</output><button data-act="mp">+</button></div></div>
    </div>
    ${e ? `<p class="small center" style="margin-top:8px">Wenn der Tausch klappt: ${GD.B.e} ${e.B} · ${GD.S.e} ${e.S} → <b>${Math.min(e.B, e.S)} Menüs</b></p>` : ''}
    <div class="btns"><button class="pri" data-act="offer" ${left < 1 || st.busy ? 'disabled' : ''}>Angebot machen</button><button data-act="ask" ${left < 1 || st.busy ? 'disabled' : ''}>💡 ${BOT[bl() - 1]} um Vorschlag bitten</button></div>
    <div class="btns"><button data-act="askRates" ${st.shownRates ? 'disabled' : ''}>💬 Was schaffst du pro Stunde?</button><button class="ghost" data-act="endTrade" ${st.busy ? 'disabled' : ''}>Verhandlung beenden</button></div></div>`;
}

/* ----- Auflösung ----- */
function rResolve() {
  const inf = stageInfo(st.si), s = inf.s, r1 = s.rates[1], r2 = s.rates[2], R = st.res[st.si];
  const mA = { p: mn(R.A.p), o: mn(R.A.o) }, mB = { p: mn(R.B.p), o: mn(R.B.o) };
  const cB = (r) => r.S / r.B, cS = (r) => r.B / r.S;
  const absB = r1.B === r2.B ? null : (r1.B > r2.B ? 1 : 2), absS = r1.S === r2.S ? null : (r1.S > r2.S ? 1 : 2);
  const compB = cB(r1) === cB(r2) ? null : (cB(r1) < cB(r2) ? 1 : 2), compS = compB ? 3 - compB : null;
  const lo = Math.min(cB(r1), cB(r2)), hi = Math.max(cB(r1), cB(r2));
  const abs = (absB === absS && absB) ? `<b>${LAND[absB - 1]}</b> hat bei <b>beiden</b> Gütern einen absoluten Vorteil (es schafft pro Stunde mehr).`
    : `<b>${LAND[absB - 1]}</b> hat bei ${GD.B.e} den absoluten Vorteil, <b>${LAND[absS - 1]}</b> bei ${GD.S.e} (jeweils mehr pro Stunde).`;
  const comp = `Den <b>komparativen Vorteil</b> hat bei ${GD.B.e} <b>${LAND[compB - 1]}</b> (1 Doppelburger kostet dort nur ${fnum(cB(s.rates[compB]))} Smoothie${cB(s.rates[compB]) === 1 ? '' : 's'}) und bei ${GD.S.e} <b>${LAND[compS - 1]}</b> (1 Smoothie kostet dort nur ${fnum(cS(s.rates[compS]))} Doppelburger).`;
  const tot = { A: mA.p + mA.o, B: mB.p + mB.o }, mx = Math.max(tot.B, tot.A, inf.joint.m, 1);

    <p>Ricardo wurde 1772 in <b>London</b> als Sohn einer aus den Niederlanden eingewanderten jüdischen Händlerfamilie geboren. Mit 14 Jahren arbeitete er an der Börse seines Vaters. Als er eine Quäkerin heiratete, brach er mit seiner Familie und machte sich als Börsenmakler selbstständig. Er wurde so reich, dass er sich mit Anfang 40 aus dem Geschäft zurückzog.</p>
    <p>1799 las er das Buch „Wohlstand der Nationen" von <b>Adam Smith</b> und wurde Ökonom. 1817 erschien sein Hauptwerk <i>„On the Principles of Political Economy and Taxation"</i>. 1819 wurde er ins britische Parlament gewählt, wo er sich für freien Handel einsetzte.</p>
    <h3 style="clear:both">Seine Zeit</h3>
    <div class="tl">
      <div><b>~1760–1840</b><span>Industrielle Revolution: Dampfmaschinen, Fabriken, wachsende Städte in England</span></div>
      <div><b>1803–1815</b><span>Napoleonische Kriege; Napoleon sperrt 1806 die Häfen Europas für britische Waren (Kontinentalsperre)</span></div>
      <div><b>1815</b><span>Die britischen <b>Korngesetze</b> verteuern Getreideeinfuhren, um Großgrundbesitzer zu schützen. Ricardo ist dagegen.</span></div>
      <div><b>1817</b><span>Ricardo veröffentlicht seine Theorie des Außenhandels</span></div>
      <div><b>1823</b><span>Ricardo stirbt auf seinem Landgut in Gloucestershire</span></div>
    </div>
    <div class="note"><b>Der Streit damals:</b> Sollte England Getreide aus dem Ausland einführen dürfen? Großgrundbesitzer sagten nein, Fabrikbesitzer und viele Arbeiter ja, weil Brot dann billiger wird. Ricardo suchte eine allgemeine Antwort: <b>Wann lohnt sich Handel zwischen Ländern?</b></div>`;
  if (P === 1) body = `<h2>🍷 Das berühmte Beispiel: England und Portugal</h2>
    <p>Ricardo verglich zwei Länder, die <b>Tuch</b> 🧵 und <b>Wein</b> 🍷 herstellen. Die Zahlen geben an, wie viele Arbeitsjahre für <i>eine</i> Einheit nötig sind (weniger ist besser):</p>
    <table><tr><th></th><th>🧵 Tuch</th><th>🍷 Wein</th></tr><tr><td>🇬🇧 England</td><td>100</td><td>120</td></tr><tr><td>🇵🇹 Portugal</td><td>90</td><td>80</td></tr></table>
    <p style="margin-top:10px">Portugal ist bei <b>beidem</b> besser, es hat bei beiden einen absoluten Vorteil. Trotzdem lohnt sich der Handel:</p>
    <table><tr><th></th><th>1 Tuch kostet …</th><th>1 Wein kostet …</th></tr><tr><td>🇬🇧 England</td><td>0,83 Wein</td><td>1,2 Tuch</td></tr><tr><td>🇵🇹 Portugal</td><td>1,13 Wein</td><td>0,89 Tuch</td></tr></table>
    <p style="margin-top:10px">England verzichtet beim Tuch auf weniger Wein als Portugal, Portugal verzichtet beim Wein auf weniger Tuch. Also konzentriert sich <b>England auf Tuch</b> und <b>Portugal auf Wein</b>.</p>
    <div class="note ok"><b>Ergebnis bei gleichem Arbeitseinsatz</b> (England 220, Portugal 170 Arbeitsjahre):<br>ohne Handel: 2 Tuch und 2 Wein.<br>mit Spezialisierung: <b>2,2 Tuch</b> (England) und <b>2,125 Wein</b> (Portugal), also von beidem mehr. Durch Tausch bekommen beide Länder etwas davon.</div>
    <p class="small mut">Das ist dein Spiel in Stufe 2: Grünland (wie Portugal) war überall besser, und der Handel lohnte sich trotzdem.</p>`;
  if (P === 2) body = `<h2>💡 Die wichtigsten Erkenntnisse</h2>
    <div class="ric-k"><b>1 · Absoluter Vorteil</b><span>Wer pro Stunde mehr schafft, hat einen absoluten Vorteil (Adam Smith). Das war deine <b>Stufe 1</b>: Jedes Land konnte etwas besser.</span></div>
    <div class="ric-k"><b>2 · Komparativer Vorteil</b><span>Ricardos Kernidee: Entscheidend ist nicht, wer mehr schafft, sondern wer <b>relativ</b> besser ist, also wer beim Verzicht auf das andere Gut weniger aufgibt (<b>Opportunitätskosten</b>). Das war <b>Stufe 2</b>.</span></div>
    <div class="ric-k"><b>3 · Beide gewinnen</b><span>Auch das schwächere Land profitiert und auch das stärkere. Mit Arbeitsteilung und Tausch entsteht insgesamt mehr (im Spiel: mehr Menüs). Handel ist kein Nullsummenspiel.</span></div>
    <div class="ric-k"><b>4 · Der Preis liegt dazwischen</b><span>Der Tausch lohnt sich für beide nur, wenn das Tauschverhältnis zwischen den beiden Opportunitätskosten liegt. Wo genau, wird <b>verhandelt</b>, und davon hängt ab, wer mehr vom Gewinn bekommt.</span></div>
    <div class="ric-k"><b>5 · Spezialisieren</b><span>Jedes Land konzentriert sich auf das Gut mit den niedrigsten Opportunitätskosten und kauft den Rest ein.</span></div>`;
  if (P === 3) body = `<h2>🌍 Grenzen der Theorie – und heute</h2>
    <p>Ricardos Modell ist bewusst einfach: zwei Länder, zwei Güter, nur Arbeit als Produktionsfaktor, keine Transportkosten. In der Wirklichkeit gibt es Folgendes:</p>
    <div class="ric-k"><b>Gewinner und Verlierer im Land</b><span>Im Ganzen gewinnt ein Land, aber Beschäftigte in Branchen, die schrumpfen, verlieren oft ihre Arbeitsplätze und müssen umlernen oder umziehen.</span></div>
    <div class="ric-k"><b>Abhängigkeit</b><span>Wer sich stark spezialisiert, wird abhängiger von Handelspartnern (zum Beispiel in Krisen oder Kriegen).</span></div>
    <div class="ric-k"><b>Junge Industrien</b><span>Ein Land kann einen Vorteil erst aufbauen. Manche Staaten schützen neue Branchen deshalb zeitweise durch Zölle.</span></div>
    <div class="ric-k"><b>Weitere Faktoren</b><span>Transportkosten, Umweltfolgen, mehr als zwei Länder und Güter, Kapital und Know-how.</span></div>
    <div class="note"><b>Heute</b> ist die Idee eine Grundlage der Handelspolitik und der Welthandelsorganisation (WTO). Sie hilft zu verstehen, warum Länder Autos, Handys oder Kleidung auch dann tauschen, wenn sie alles selbst herstellen könnten.</div>
    <h3>Zum Diskutieren</h3>
    <p>• Warum sollte ein Land, das alles besser kann, trotzdem handeln?<br>• Wer verliert, wenn Billigimporte kommen, und was könnte helfen?<br>• Wo ist Spezialisierung auch riskant?</p>`;
  return `<div class="card">${dots}${body}${nav}</div>`;
}

function animateBars() {
  const seen = st.barsSeen === st.si; st.barsSeen = st.si;
  setTimeout(() => document.querySelectorAll('.bar i').forEach((el) => { if (seen) el.style.transition = 'none'; el.style.width = Math.max(+el.dataset.w, 12) + '%'; }), seen ? 0 : 80);
}

function summaryText() {
  const parts = [];
  [0, 1].forEach((i) => { const R = st.res[i]; if (R.A && R.B) parts.push(`Stufe ${i + 1}: ${mn(R.A.p)} → ${mn(R.B.p)} Menüs (${st.att[i].length} Handelsrunde${st.att[i].length === 1 ? '' : 'n'}${R.B.j && R.B.j.success ? ', bestes Ergebnis' : ''}) (zusammen ${mn(R.A.p) + mn(R.A.o)} → ${mn(R.B.p) + mn(R.B.o)})`); });
  return `Handelsinseln · ${st.name || 'ohne Namen'} · ${LAND[pl() - 1]} · Computer: ${DIFF[st.diff].label} · ` + parts.join(' · ');
}
function rEnd() {
  return `<div class="card"><h2>Geschafft! 🎉</h2>
    <p>${summaryText()}</p><div class="btns"><button data-act="copy">📋 Ergebnis kopieren</button></div>
    <div class="note ok"><b>Merke:</b><br>• Handel lohnt sich, wenn sich jedes Land auf das Gut konzentriert, bei dem es die <b>geringsten Opportunitätskosten</b> hat.<br>• Das gilt auch dann, wenn ein Land bei <i>allem</i> besser ist (komparativer Vorteil).<br>• Beide Länder können dadurch mehr Menüs erreichen – wie der Gewinn aufgeteilt wird, hängt vom Verhandlungsgeschick ab.</div>
    <button class="pri big" data-act="again">Noch einmal spielen (z. B. mit anderem Land)</button></div>`;
}

main.addEventListener('click', async (ev) => {
  const t = ev.target.closest('button'); if (!t || st.busy && !t.dataset.q) return;
  const d = t.dataset;
  if (d.land) { st.land = +d.land; st.name = ($('#inName') || {}).value || st.name; return render(); }
  if (d.start != null) { st.name = ($('#inName').value || '').trim(); st.diff = $('#inDiff').value; st.startStage = +d.start; st.res = [{}, {}]; st.quiz = {}; return startStage(+d.start); }
  if (d.tile) { st.hB = +d.tile === st.hB ? +d.tile - 1 : +d.tile; return render(); }
  if (d.give) { st.give = d.give; st.n = Math.min(st.n, st.stock[pl()][st.give]); return render(); }
  if (d.q != null) { st.quiz[st.si] = +d.q; return render(); }
  switch (d.act) {
    case 'toPlan': return go('plan');
    case 'hm': st.hB = Math.max(0, st.hB - 1); return render();
    case 'hp': st.hB = Math.min(H, st.hB + 1); return render();
    case 'produce': return doProduce();
    case 'roundB': return finishRoundA();
    case 'retry': return retryTrade();
    case 'toResolve': return go('resolve');
    case 'nm': st.n = Math.max(0, st.n - 1); return render();
    case 'np': st.n = Math.min(st.stock[pl()][st.give], st.n + 1); return render();
    case 'mm': st.m = Math.max(0, st.m - 1); return render();
    case 'mp': st.m = Math.min(99, st.m + 1); return render();
    case 'askRates': { const r = oth(); say('me', 'Was schaffst du pro Stunde?'); say('bot', `Ich schaffe pro Stunde <b>${r.B} × ${GD.B.e}</b> <i>oder</i> <b>${r.S} × ${GD.S.e}</b>.`); st.shownRates = true; return render(); }
    case 'offer': return doOffer();
    case 'ask': return doAsk();
    case 'acceptPending': { const o = st.pending; st.pending = null; return execDeal(o, true); }
    case 'dropPending': st.pending = null; say('sys', 'Gegenvorschlag abgelehnt.'); return render();
    case 'endTrade': st.pending = null; return finishTradeNow();
    case 'next': if (st.si === 0 && st.startStage === 0) { return startStage(1); } st.rp = 0; return go('ric');
    case 'ricEnd': return go('end');
    case 'rp': st.rp = Math.max(0, Math.min(3, st.rp + +d.d)); return go('ric');
    case 'again': st = freshState(); return render();
    case 'copy': try { await navigator.clipboard.writeText(summaryText()); t.textContent = '✓ Kopiert'; } catch (e) { t.textContent = 'Markieren und kopieren'; } return;
  }
});
function finishTradeNow() { say('sys', 'Verhandlung beendet.'); st.hidden = false; showStock(); finishTrade(); }
async function execDeal(o, fromBot) {
  const P = st.stock[pl()], Q = st.stock[bl()], r = dealApply(P, Q, o);
  say('me', fromBot ? 'Einverstanden mit deinem Vorschlag.' : 'Angebot: ' + offerTxt(o)); if (!fromBot) say('bot', 'Abgemacht! 🤝');
  if (fromBot) say('bot', 'Abgemacht! 🤝');
  st.busy = true; st.tries--; render();
  await tradeAnim(o);
  st.stock[pl()] = r.P; st.stock[bl()] = r.Q; st.hidden = true; showStock();
  st.busy = false;
  say('sys', 'Handel abgeschlossen.'); st.hidden = false; showStock(); render();
  await sleep(1400); finishTrade();
}
async function doOffer() {
  const P = st.stock[pl()], Q = st.stock[bl()], o = { give: st.give, n: Math.min(st.n, P[st.give]), m: st.m };
  st.pending = null;
  const a = botAnswer(st.si, pl(), P, Q, o, st.diff);
  if (!a.ok) {
    say('me', 'Angebot: ' + offerTxt(o)); say('bot', a.text); st.tries--;
    if (DIFF[st.diff].auto && a.thin) { const c = botCounter(st.si, pl(), P, Q, st.diff); if (c) { say('bot', 'Wie wäre es stattdessen damit?'); st.pending = c.o; } }
    if (st.tries < 1 && !st.pending) { say('sys', 'Alle Verhandlungsschritte sind verbraucht.'); return finishTradeNow(); }
    return render();
  }
  return execDeal(o, false);
}
function doAsk() {
  const P = st.stock[pl()], Q = st.stock[bl()]; st.pending = null; st.tries--;
  say('me', 'Hast du einen Vorschlag?');
  const c = botCounter(st.si, pl(), P, Q, st.diff);
  if (c) { say('bot', 'Ja: ' + offerTxt(c.o) + '.'); st.pending = c.o; } else say('bot', 'Im Moment sehe ich keinen Tausch, der uns beiden etwas bringt.');
  if (st.tries < 1 && !st.pending) { say('sys', 'Alle Verhandlungsschritte sind verbraucht.'); return finishTradeNow(); }
  render();
}
